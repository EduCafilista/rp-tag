plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = 'dev.rptag'
version = '4.5.1'

base {
    archivesName = 'rptag'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // NeoForge para Minecraft 1.21.1
    version = '21.1.249'

    runs {
        client {
            client()
            // (4.2.0) ./gradlew runClient -PrptagTeste = entra sozinho no servidor de teste (run-server/)
            if (project.hasProperty('rptagTeste')) {
                programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25565')
            }
        }
        server {
            server()
            programArgument '--nogui'
            // (4.2.0) servidor de teste em pasta propria (o cliente usa run/; logs nao se misturam)
            gameDirectory = file('run-server')
        }
    }

    mods {
        rptag {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'rptag',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'RP Tag',
                'Implementation-Version': project.version
        ])
    }
}

// (4.2.0) primeiros testes Java (JUnit 5) — so classes puras, sem Minecraft
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}
